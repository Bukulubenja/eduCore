components:
  schemas:
    Announcement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 200
        body:
          type: string
        importance:
          $ref: '#/components/schemas/ImportanceEnum'
        audience: {}
        channels: {}
        requires_acknowledgement:
          type: boolean
        status:
          allOf:
          - $ref: '#/components/schemas/AnnouncementStatusEnum'
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        recipients_count:
          type: integer
          readOnly: true
      required:
      - body
      - id
      - published_at
      - recipients_count
      - status
      - title
    AnnouncementStatusEnum:
      enum:
      - draft
      - scheduled
      - published
      - withdrawn
      type: string
      description: |-
        * `draft` - Draft
        * `scheduled` - Scheduled
        * `published` - Published
        * `withdrawn` - Withdrawn
    Appeal:
      type: object
      properties:
        reason_code:
          $ref: '#/components/schemas/ReasonCodeEnum'
        narrative:
          type: string
          maxLength: 2000
        requested_status:
          type: string
      required:
      - reason_code
    Assessment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        course:
          type: string
          format: uuid
        term:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 200
        kind:
          $ref: '#/components/schemas/KindEnum'
        max_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        scheduled_for:
          type: string
          format: date
          nullable: true
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          readOnly: true
        author:
          type: string
          format: uuid
          readOnly: true
        approved_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        moderated_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        released_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        released_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        returned_note:
          type: string
          readOnly: true
      required:
      - approved_by
      - author
      - course
      - id
      - kind
      - max_score
      - moderated_by
      - released_at
      - released_by
      - returned_note
      - state
      - term
      - title
    AttendanceStatusEnum:
      enum:
      - present
      - late
      - partial
      - absent
      - on_leave
      - holiday
      type: string
      description: |-
        * `present` - Present
        * `late` - Late
        * `partial` - Partial
        * `absent` - Absent
        * `on_leave` - On leave
        * `holiday` - Holiday
    BlankEnum:
      enum:
      - ''
    CheckIn:
      type: object
      properties:
        client_event_id:
          type: string
          format: uuid
        campus_id:
          type: string
          format: uuid
        captured_at:
          type: string
          format: date-time
        signals:
          type: object
          additionalProperties:
            type: object
            additionalProperties: {}
      required:
      - campus_id
      - captured_at
      - client_event_id
    CloseSession:
      type: object
      properties:
        coverage:
          type: array
          items:
            $ref: '#/components/schemas/CoverageItem'
        notes:
          type: string
      required:
      - coverage
    CompletionEnum:
      enum:
      - introduced
      - partial
      - completed
      type: string
      description: |-
        * `introduced` - Introduced
        * `partial` - Partly covered
        * `completed` - Completed
    CoverageItem:
      type: object
      properties:
        unit_id:
          type: string
          format: uuid
        completion:
          allOf:
          - $ref: '#/components/schemas/CompletionEnum'
          default: partial
        homework_set:
          type: string
        notes:
          type: string
      required:
      - unit_id
    Decision:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/DecisionDecisionEnum'
        note:
          type: string
          maxLength: 2000
      required:
      - decision
    DecisionDecisionEnum:
      enum:
      - upheld
      - declined
      type: string
      description: |-
        * `upheld` - upheld
        * `declined` - declined
    DirectionEnum:
      enum:
      - in
      - out
      type: string
      description: |-
        * `in` - Arrival
        * `out` - Departure
    DispositionEnum:
      enum:
      - verified
      - provisional
      - rejected
      type: string
      description: |-
        * `verified` - Verified
        * `provisional` - Provisional
        * `rejected` - Rejected
    Exception:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        record:
          type: string
          format: uuid
        raised_by:
          type: string
          format: uuid
          readOnly: true
        reason_code:
          $ref: '#/components/schemas/ReasonCodeEnum'
        narrative:
          type: string
        requested_status:
          oneOf:
          - $ref: '#/components/schemas/AttendanceStatusEnum'
          - $ref: '#/components/schemas/BlankEnum'
        decision:
          allOf:
          - $ref: '#/components/schemas/ExceptionDecisionEnum'
          readOnly: true
        decided_by:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        decision_note:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - decided_at
      - decided_by
      - decision
      - decision_note
      - id
      - raised_by
      - reason_code
      - record
    ExceptionDecisionEnum:
      enum:
      - pending
      - upheld
      - declined
      type: string
      description: |-
        * `pending` - Pending
        * `upheld` - Upheld
        * `declined` - Declined
    GateBatch:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/GateEvent'
      required:
      - events
    GateEvent:
      type: object
      properties:
        client_event_id:
          type: string
          format: uuid
        scan_code:
          type: string
        campus_id:
          type: string
          format: uuid
        direction:
          $ref: '#/components/schemas/DirectionEnum'
        occurred_at:
          type: string
          format: date-time
        method:
          allOf:
          - $ref: '#/components/schemas/MethodEnum'
          default: qr
      required:
      - campus_id
      - client_event_id
      - direction
      - occurred_at
      - scan_code
    GenerateReportCards:
      type: object
      properties:
        class_group_id:
          type: string
          format: uuid
        term_id:
          type: string
          format: uuid
      required:
      - class_group_id
      - term_id
    Import:
      type: object
      properties:
        file:
          type: string
          format: uri
        apply:
          type: boolean
          default: false
        term_id:
          type: string
          format: uuid
      required:
      - file
    ImportanceEnum:
      enum:
      - routine
      - important
      - urgent
      type: string
      description: |-
        * `routine` - Routine
        * `important` - Important
        * `urgent` - Urgent
    KindEnum:
      enum:
      - exercise
      - test
      - midterm
      - end_of_term
      - mock
      - national
      type: string
      description: |-
        * `exercise` - Exercise
        * `test` - Class test
        * `midterm` - Mid-term
        * `end_of_term` - End of term
        * `mock` - Mock
        * `national` - National examination
    MethodEnum:
      enum:
      - qr
      - nfc
      - barcode
      - manual
      type: string
      description: |-
        * `qr` - QR code
        * `nfc` - NFC card
        * `barcode` - Barcode
        * `manual` - Recorded manually
    MfaCode:
      type: object
      properties:
        code:
          type: string
          maxLength: 10
      required:
      - code
    OpenSession:
      type: object
      properties:
        room_id:
          type: string
          format: uuid
        token:
          type: string
        captured_at:
          type: string
          format: date-time
      required:
      - room_id
      - token
    OpenThread:
      type: object
      properties:
        student_id:
          type: string
          format: uuid
        subject:
          type: string
          maxLength: 200
        first_message:
          type: string
          default: ''
      required:
      - student_id
      - subject
    PaginatedAssessmentList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Assessment'
    PaginatedExceptionList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Exception'
    PaginatedRecordList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Record'
    PostMessage:
      type: object
      properties:
        body:
          type: string
          maxLength: 8000
      required:
      - body
    ReasonCodeEnum:
      enum:
      - device_fault
      - no_connectivity
      - off_site_duty
      - approved_leave
      - sick
      - other
      type: string
      description: |-
        * `device_fault` - Device fault
        * `no_connectivity` - No connectivity
        * `off_site_duty` - Off-site school duty
        * `approved_leave` - Approved leave
        * `sick` - Sick
        * `other` - Other
    Record:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        membership_id:
          type: string
          format: uuid
          readOnly: true
        date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
        disposition:
          $ref: '#/components/schemas/DispositionEnum'
        confidence:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        first_in_at:
          type: string
          format: date-time
          nullable: true
        last_out_at:
          type: string
          format: date-time
          nullable: true
        minutes_on_site:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        resolution:
          $ref: '#/components/schemas/ResolutionEnum'
        policy_version:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        needs_review:
          type: boolean
          readOnly: true
      required:
      - date
      - disposition
      - id
      - membership_id
      - needs_review
      - policy_version
      - status
    Refresh:
      type: object
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
    RegisterException:
      type: object
      properties:
        student_id:
          type: string
          format: uuid
        status:
          allOf:
          - $ref: '#/components/schemas/RegisterExceptionStatusEnum'
          default: absent
        note:
          type: string
          maxLength: 200
      required:
      - student_id
    RegisterExceptionStatusEnum:
      enum:
      - present
      - absent
      - late
      - excused
      - sick
      type: string
      description: |-
        * `present` - Present
        * `absent` - Absent
        * `late` - Late
        * `excused` - Excused
        * `sick` - Sick
    ResolutionEnum:
      enum:
      - auto
      - reviewed
      - overridden
      type: string
      description: |-
        * `auto` - Automatic
        * `reviewed` - Reviewed
        * `overridden` - Overridden
    ScoreItem:
      type: object
      properties:
        student_id:
          type: string
          format: uuid
        raw_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
          nullable: true
        is_absent:
          type: boolean
          default: false
        comment:
          type: string
          maxLength: 200
      required:
      - student_id
    Scores:
      type: object
      properties:
        marks:
          type: array
          items:
            $ref: '#/components/schemas/ScoreItem'
        reason:
          type: string
          maxLength: 200
      required:
      - marks
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        lesson_instance:
          type: string
          format: uuid
        actual_teacher:
          type: string
          format: uuid
        room:
          type: string
          format: uuid
        opened_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        room_changed:
          type: boolean
        late_start_minutes:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        verification_confidence:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        duration_minutes:
          type: integer
          readOnly: true
        notes:
          type: string
      required:
      - actual_teacher
      - duration_minutes
      - id
      - lesson_instance
      - opened_at
      - room
    StateEnum:
      enum:
      - draft
      - submitted
      - approved
      - locked
      - scoring
      - moderation
      - head_review
      - released
      type: string
      description: |-
        * `draft` - Draft
        * `submitted` - Submitted for approval
        * `approved` - Approved
        * `locked` - Locked
        * `scoring` - Scoring
        * `moderation` - In moderation
        * `head_review` - Awaiting head teacher
        * `released` - Released
    SubmitRegister:
      type: object
      properties:
        exceptions:
          type: array
          items:
            $ref: '#/components/schemas/RegisterException'
      required:
      - exceptions
    SwitchSchool:
      type: object
      properties:
        membership_id:
          type: string
          format: uuid
      required:
      - membership_id
    Sync:
      type: object
      properties:
        device_id:
          type: string
        device_time:
          type: string
          format: date-time
        operations:
          type: array
          items:
            $ref: '#/components/schemas/SyncOperation'
      required:
      - operations
    SyncOperation:
      type: object
      properties:
        client_event_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TypeEnum'
        captured_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: {}
      required:
      - captured_at
      - client_event_id
      - payload
      - type
    TokenRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        membership_id:
          type: string
          format: uuid
      required:
      - email
      - password
    Transition:
      type: object
      properties:
        note:
          type: string
          maxLength: 2000
        step_up_token:
          type: string
    TypeEnum:
      enum:
      - attendance.check_in
      - attendance.check_out
      type: string
      description: |-
        * `attendance.check_in` - attendance.check_in
        * `attendance.check_out` - attendance.check_out
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /api/v1/auth/token. Carries the Membership
        claim; the tenant is derived from it and can never be supplied by the client.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
